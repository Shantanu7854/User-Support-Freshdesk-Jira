# Keeps the demo alive between showings.
#
# Solves two problems with one request: Render's free tier sleeps after 15
# minutes idle (~50s cold start), and Supabase pauses a free project after 7
# days idle, requiring a MANUAL restore from the dashboard. /api/health runs a
# real query, so this ping keeps the web service warm AND the database active.
#
# Set the APP_URL repository variable (Settings -> Secrets and variables ->
# Actions -> Variables) to your Render URL.
name: Keep demo warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.APP_URL }}"
          if [ -z "$URL" ]; then
            echo "APP_URL variable not set - skipping"
            exit 0
          fi
          echo "Pinging $URL/api/health"
          curl -sS --max-time 90 "$URL/api/health" || echo "Ping failed (service may be waking)"
